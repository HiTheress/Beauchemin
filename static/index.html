<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --warn:#b42318; --warnbg:#fef3f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1319; --card:#171c24; --text:#e6e9ef; --muted:#98a2b3; --line:#2a313c; --accent:#5b8def; --warn:#fda29b; --warnbg:#3a1a18; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 16px; font-size:22px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--muted); font-size:13px; }
  form.add { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-bottom:16px; }
  input,button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { cursor:pointer; } button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--warn); }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .toolbar input[type=search] { flex:1; min-width:160px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tr.low td { background:var(--warnbg); }
  .qty { display:inline-flex; align-items:center; gap:6px; }
  .qty button { padding:2px 9px; }
  .err { color:var(--warn); min-height:1.4em; margin:4px 0 8px; }
  .empty { color:var(--muted); text-align:center; padding:24px; }
</style>
</head>
<body>
<main>
  <h1>Inventory</h1>
  <div class="stats" id="stats"></div>

  <form class="add card" id="add">
    <input name="sku" placeholder="SKU" required>
    <input name="name" placeholder="Name" required>
    <input name="quantity" type="number" min="0" placeholder="Qty" value="0">
    <input name="price" type="number" min="0" step="0.01" placeholder="Price" value="0">
    <input name="reorder_level" type="number" min="0" placeholder="Reorder at" value="5">
    <button class="primary">Add item</button>
  </form>
  <div class="err" id="err" role="alert"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name or SKU">
    <label><input type="checkbox" id="low"> Low stock only</label>
  </div>
  <div class="card table-wrap">
    <table>
      <thead><tr><th>SKU</th><th>Name</th><th>Quantity</th><th>Price</th><th>Reorder at</th><th>Value</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const money = n => n.toLocaleString(undefined, {style:'currency', currency:'USD'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body && JSON.stringify(body)});
  if (r.status === 204) return null;
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const show = e => $('#err').textContent = e ? e.message : '';

async function load() {
  const [items, s] = await Promise.all([
    api(`/api/items?q=${encodeURIComponent($('#q').value)}&low=${$('#low').checked ? 1 : 0}`),
    api('/api/summary'),
  ]);
  $('#stats').innerHTML = [['Items', s.items], ['Units', s.units], ['Stock value', money(s.value)], ['Low stock', s.low_stock]]
    .map(([k, v]) => `<div class="card stat"><b>${esc(v)}</b><span>${k}</span></div>`).join('');
  $('#rows').innerHTML = items.length ? items.map(i => `
    <tr class="${i.quantity <= i.reorder_level ? 'low' : ''}">
      <td>${esc(i.sku)}</td><td>${esc(i.name)}</td>
      <td><span class="qty"><button data-adj="-1" data-id="${i.id}">−</button>${i.quantity}<button data-adj="1" data-id="${i.id}">+</button></span></td>
      <td>${money(i.price)}</td><td>${i.reorder_level}</td><td>${money(i.price * i.quantity)}</td>
      <td><button data-edit="${i.id}">Edit</button> <button class="danger" data-del="${i.id}">Delete</button></td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">No items yet.</td></tr>';
  window.items = items;
}
const run = async fn => { try { show(); await fn(); await load(); } catch (e) { show(e); } };

$('#add').onsubmit = e => { e.preventDefault();
  run(async () => { await api('/api/items', 'POST', Object.fromEntries(new FormData(e.target))); e.target.reset(); }); };
$('#q').oninput = () => run(async () => {});
$('#low').onchange = () => run(async () => {});
$('#rows').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.adj) run(() => api(`/api/items/${d.id}/adjust`, 'POST', {delta: +d.adj}));
  if (d.del && confirm('Delete this item?')) run(() => api(`/api/items/${d.del}`, 'DELETE'));
  if (d.edit) {
    const i = window.items.find(x => x.id == d.edit);
    const name = prompt('Name', i.name); if (name === null) return;
    const price = prompt('Price', i.price); if (price === null) return;
    const reorder_level = prompt('Reorder level', i.reorder_level); if (reorder_level === null) return;
    run(() => api(`/api/items/${i.id}`, 'PUT', {name, price, reorder_level}));
  }
};
run(async () => {});
</script>
</body>
</html>
