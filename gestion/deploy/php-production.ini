; Beauchemin — réglages PHP recommandés en production
; Ubuntu/Debian : copier vers /etc/php/8.3/fpm/conf.d/90-beauchemin.ini puis : sudo systemctl reload php8.3-fpm
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1          ; site servi en HTTPS seulement
session.cookie_samesite = Lax
session.gc_maxlifetime = 28800     ; 8 h d'inactivité avant déconnexion (quart de travail)
upload_max_filesize = 4M
post_max_size = 8M
memory_limit = 256M
date.timezone = America/Toronto
