# Beauchemin — exemple de serveur nginx + PHP-FPM (Ubuntu/Debian). Adaptez server_name, chemins et certificats.
# Les certificats : sudo certbot --nginx -d inventaire.exemple.com
server {
    listen 80;
    server_name inventaire.exemple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inventaire.exemple.com;

    ssl_certificate     /etc/letsencrypt/live/inventaire.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventaire.exemple.com/privkey.pem;

    root /var/www/beauchemin/gestion;
    index index.php;
    client_max_body_size 3m;          # import CSV (2 Mo max côté application)

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Rien de caché, de configuration ou de code interne n'est servi directement.
    location ~ (^|/)\.                                          { return 404; }
    location ~ ^/(pages|inc|tests|tools|docs|database|deploy)(/|$) { return 404; }
    location ~ ^/app/(classes|config|database)(/|$)             { return 404; }
    location ~ ^/app/(functions|init)\.php$                     { return 404; }
    location ~* \.(sql|md|sh|log|bak|ini|lock)$                 { return 404; }

    location / { try_files $uri $uri/ =404; }

    # PHP : seulement les points d'entrée prévus.
    location ~ ^/(index|login)\.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location ~ ^/app/(action|ajax)/[^/]+\.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location ~ \.php$ { return 404; }
}
