# Beauchemin — exemple de vhost Apache 2.4 + PHP-FPM. Adaptez server_name, chemins et certificats.
# a2enmod rewrite headers ssl proxy_fcgi setenvif alias ; a2enconf php8.3-fpm ; certbot --apache -d inventaire.exemple.com
<VirtualHost *:80>
    ServerName inventaire.exemple.com
    Redirect permanent / https://inventaire.exemple.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventaire.exemple.com
    DocumentRoot /var/www/beauchemin/gestion
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/inventaire.exemple.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventaire.exemple.com/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 3145728

    <Directory /var/www/beauchemin/gestion>
        AllowOverride All          # active le fichier .htaccess fourni (interdictions d'accès)
        Require all granted
    </Directory>
</VirtualHost>
