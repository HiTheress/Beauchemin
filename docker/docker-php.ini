; Réglages PHP de l'environnement d'essai (HTTP local : pas de cookie « secure »). En production, voir gestion/deploy/php-production.ini.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 28800
upload_max_filesize = 4M
post_max_size = 8M
memory_limit = 256M
date.timezone = America/Toronto
